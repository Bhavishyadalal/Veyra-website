<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Veyra — Your music. Another dimension.</title><desc id="desc">Bold pale typography with chrome frequency curves on a obsidian and amber field.</desc>
<defs><radialGradient id="halo"><stop stop-color="#ad9d7a" stop-opacity=".4"/><stop offset="1" stop-color="#080809" stop-opacity="0"/></radialGradient><linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset=".2" stop-color="#34303c"/><stop offset=".4" stop-color="#e5e0d1"/><stop offset=".6" stop-color="#1b1624"/><stop offset=".83" stop-color="#d1c4a7"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<style>.frequency{transform-origin:1040px 230px;animation:drift 9s ease-in-out infinite alternate}.signal{animation:glimmer 4s ease-in-out infinite alternate}@keyframes drift{from{transform:rotate(-7deg) scale(.97)}to{transform:rotate(7deg) scale(1.03)}}@keyframes glimmer{from{opacity:.4}to{opacity:1}}@media(prefers-reduced-motion:reduce){.frequency,.signal{animation:none}}</style>
<rect width="1280" height="440" rx="20" fill="#080809"/><ellipse cx="1070" cy="225" rx="330" ry="250" fill="url(#halo)"/><path d="M45 95H1235M45 389H1235" stroke="#ffffff20"/><text x="48" y="58" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#eee7f7">VEYRA</text><text x="1230" y="56" text-anchor="end" font-family="Arial,sans-serif" font-size="10" letter-spacing="3" fill="#c9c1ae">REFRACTION / V.4.0</text>
<g class="frequency" fill="none" stroke="url(#chrome)" stroke-width="19"><path d="M817 270C860 65 888 401 934 170S999 408 1050 167S1117 344 1204 118"/><path d="M839 294C879 93 914 405 957 198S1021 426 1074 196S1140 364 1223 147" opacity=".45" stroke-width="10"/></g><path class="signal" d="M770 350C980 376 1090 69 1260 95" fill="none" stroke="#d8c5a8" stroke-width="1.2"/>
<text x="43" y="206" font-family="Arial,sans-serif" font-weight="900" font-size="76" letter-spacing="-4" fill="#f0efea">YOUR MUSIC.</text><text x="43" y="300" font-family="Arial,sans-serif" font-weight="900" font-size="76" letter-spacing="-4" fill="#f0efea">ANOTHER DIMENSION<tspan fill="#d8c5a8">.</tspan></text><text x="48" y="355" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#c8c0b2">TUNE OUT THE ORDINARY.</text><text x="48" y="419" font-family="Arial,sans-serif" font-size="9" letter-spacing="2" fill="#b8b7ae">REACT · MOTION · LIQUID GLASS · DEPTH · ORIGINAL ARTWORK</text></svg>
